dependency-review:
  name: Dependency Review
  if: github.event_name == 'pull_request'
  runs-on: ubuntu-latest

  permissions:
    contents: read
    pull-requests: read

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate