name: Release

on:
  push:
    tags:
      - "v*"
  # tag-release.yml dispatches this because GITHUB_TOKEN tag pushes do not
  # start other workflows.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v3.18.2)
        required: true
        type: string

permissions: {}

jobs:
  # Validate release tag syntax, exact git tag resolution, and lockstep
  # manifest versions before any job builds artifacts or mints SLSA
  # provenance attestations.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Validate release tag format
        id: format
        env:
          # Tag push uses ref_name (vX.Y.Z); dispatch from tag-release passes inputs.tag.
          RAW_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "${RAW_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag format. Expected vMAJOR.MINOR.PATCH (e.g. v4.6.0)."
            exit 1
          fi
          echo "tag=${RAW_RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${RAW_RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.format.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag ref and manifest versions
        id: verify
        env:
          RELEASE_TAG: ${{ steps.format.outputs.tag }}
          RELEASE_VERSION: ${{ steps.format.outputs.version }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::Checked-out HEAD (${HEAD_COMMIT}) does not match refs/tags/${RELEASE_TAG} (${TAG_COMMIT})."
            exit 1
          fi

          PY_VERSION="$(python3 .github/scripts/read_manifest_version.py pyproject.toml < pyproject.toml)"
          MCP_VERSION="$(python3 .github/scripts/read_manifest_version.py mcp/manifest.json < mcp/manifest.json)"
          if [ "${PY_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Tag version (${RELEASE_VERSION}) does not match pyproject.toml (${PY_VERSION})."
            exit 1
          fi
          if [ "${MCP_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Tag version (${RELEASE_VERSION}) does not match mcp/manifest.json (${MCP_VERSION})."
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit=${TAG_COMMIT}" >> "${GITHUB_OUTPUT}"

  # Build the existing .skill artifact (Claude Code / Codex / Cursor install
  # surface). Unchanged from prior versions; just isolated into its own job
  # so the .mcpb matrix can run in parallel.
  build-skill:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out tag commit
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [ "${TAG_COMMIT}" != "${EXPECTED_COMMIT}" ] || [ "${HEAD_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo "::error::Tag ref ${RELEASE_TAG} no longer resolves to validated commit ${EXPECTED_COMMIT}."
            exit 1
          fi

      - name: Build .skill artifact
        run: |
          bash skills/last30days/scripts/build-skill.sh
          test -f dist/last30days.skill

      - name: Attest .skill artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/last30days.skill

      - name: Upload skill artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: last30days-skill
          path: dist/last30days.skill

  # Cross-compile the Go MCP server for each Claude Desktop platform and
  # package each as a .mcpb. MCPB v0.3 is a ZIP containing the checked-in
  # manifest and the pre-built binary at the manifest's entry point.
  build-mcpb:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MCPB_OUTPUT: mcp/build/last30days-pp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.mcpb
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Verify checked-out tag commit
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [ "${HEAD_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo "::error::Checked-out HEAD (${HEAD_COMMIT}) does not match validated commit ${EXPECTED_COMMIT}."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Build the MCP binary with a toolchain newer than the floor in
          # mcp/go.mod. Keeping this explicit also avoids a runtime toolchain
          # download during the cross-compile.
          go-version: "1.26"
          cache: false

      - name: Sync engine into vendored/
        run: bash mcp/scripts/sync-engine.sh

      - name: Build MCP binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid RELEASE_VERSION format for Go ldflags."
            exit 1
          fi
          mkdir -p mcp/build
          go -C mcp build \
            -ldflags "-X main.Version=${RELEASE_VERSION}" \
            -o build/last30days-pp-mcp \
            ./cmd/last30days-pp-mcp

      - name: Bundle .mcpb
        # Keep this equivalent to printing-press's bundle layout without
        # downloading a separate packager: manifest.json at the ZIP root and
        # the executable at its declared server.entry_point.
        run: |
          set -euo pipefail
          entry_point="$(jq -er '.server.entry_point' mcp/manifest.json)"
          test "${entry_point}" = "bin/last30days-pp-mcp"

          staging="${RUNNER_TEMP}/last30days-mcpb"
          output="${GITHUB_WORKSPACE}/${MCPB_OUTPUT}"
          mkdir -p "${staging}/bin" "$(dirname "${output}")"
          cp mcp/manifest.json "${staging}/manifest.json"
          cp mcp/build/last30days-pp-mcp "${staging}/${entry_point}"
          chmod 0755 "${staging}/${entry_point}"

          (
            cd "${staging}"
            zip -q -X "${output}" manifest.json "${entry_point}"
          )
          unzip -Z1 "${output}" | grep -Fxq "manifest.json"
          unzip -Z1 "${output}" | grep -Fxq "${entry_point}"

      - name: Attest .mcpb artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.MCPB_OUTPUT }}

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.MCPB_OUTPUT }}

  # Build standalone native last30days-core binaries so end users never need a
  # Rust toolchain installed. Linked only against OS system libraries.
  build-rust-core:
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            ext: ""
          - runner: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - runner: windows-latest
            platform: windows-amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Verify checked-out tag commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [ "${HEAD_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo "::error::Checked-out HEAD (${HEAD_COMMIT}) does not match validated commit ${EXPECTED_COMMIT}."
            exit 1
          fi

      - name: Build release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --release --locked
          mkdir -p rust/dist
          cp "rust/target/release/last30days-core${BIN_EXT}" "rust/dist/last30days-core-${PLATFORM}${BIN_EXT}"
          if [ -z "${BIN_EXT}" ]; then
            chmod 0755 "rust/dist/last30days-core-${PLATFORM}"
          fi

      - name: Attest last30days-core artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: rust/dist/last30days-core-${{ matrix.platform }}${{ matrix.ext }}

      - name: Upload last30days-core artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-core-${{ matrix.platform }}
          path: rust/dist/last30days-core-${{ matrix.platform }}${{ matrix.ext }}

  # Gather every platform artifact and attach to one GitHub release.
  release:
    needs: [validate, build-skill, build-mcpb, build-rust-core]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      # gh release create --verify-tag shells out to git, so the job needs a
      # checkout with the tag present; without it the step fails with
      # "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out tag commit
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [ "${TAG_COMMIT}" != "${EXPECTED_COMMIT}" ] || [ "${HEAD_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo "::error::Tag ref ${RELEASE_TAG} no longer resolves to validated commit ${EXPECTED_COMMIT}."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/last30days.skill \
            dist/last30days-pp-mcp-*.mcpb \
            dist/last30days-core-* \
            --generate-notes \
            --verify-tag
