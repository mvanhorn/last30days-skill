[project]
name = "last30days-skill"
version = "3.25.0"
description = "Multi-source last-30-days research skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "pyyaml>=6.0.2,<7",
  "towncrier>=25.8.0,<27",
]

[tool.towncrier]
name = "last30days-skill"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/mvanhorn/last30days-skill/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--tb=short",
]

[tool.coverage.run]
branch = true
source = ["skills/last30days/scripts"]
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
# Coverage gate (issue #254). Floor intended to rise over time, not a ceiling.
# Baseline measured 2026-09-23 on the full suite with scripts-tree source
# (tests/ excluded): TOTAL 82.28%. The previous 84 floor was measured with
# source = scripts + tests, where well-tested test code inflated the number;
# excluding tests/ lowers the honest baseline, which is why the floor moves
# 84 -> 81. Pinned at 81 (not 82) for ~1.3pp headroom against the measured
# 82.28; raise back toward 82+ as coverage grows.
# Do not lower without documenting why in the PR (see AGENTS.md Rules).
fail_under = 81
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]
